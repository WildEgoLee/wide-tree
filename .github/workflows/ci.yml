name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run acceptance tests
        run: make test
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: make asan
      - name: Build microbenchmark
        run: make build/widetree_bench

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build with MSVC C++20
        shell: cmd
        run: >
          cl /nologo /std:c++20 /EHsc /W4 /WX /Iinclude
          src\builder.cpp src\view.cpp tests\test_main.cpp
          /Fe:widetree_tests.exe
      - name: Run acceptance tests
        shell: cmd
        run: widetree_tests.exe
      - name: Build microbenchmark
        shell: cmd
        run: >
          cl /nologo /std:c++20 /EHsc /W4 /WX /Iinclude
          src\builder.cpp src\view.cpp bench\bench_main.cpp
          /Fe:widetree_bench.exe
